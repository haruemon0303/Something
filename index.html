<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ボタンを押すとランダムメッセージが表示されるWebサイト">
    <title>ランダムメッセージ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ランダムメッセージ</h1>
        </header>

        <main>
            <div class="message-box">
                <p id="message">ボタンを押してメッセージを表示</p>
            </div>

            <button id="messageBtn" class="btn">
                メッセージを表示
            </button>
        </main>

        <footer>
            <p>&copy; 2026 Random Message App</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
