<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ボタンを押すとランダムメッセージが表示されるWebサイト">
    <title>ランダムメッセージ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ランダムメッセージ</h1>
            <p class="date-display" id="dateDisplay"></p>
        </header>

        <main>
            <div class="message-box">
                <p id="message">ボタンを押してメッセージを表示</p>
            </div>

            <div class="button-group">
                <button id="messageBtn" class="btn btn-primary">
                    メッセージを表示
                </button>
                <button id="shareBtn" class="btn btn-share" title="シェア">
                    📤
                </button>
            </div>

            <div class="counter-display">
                <p id="counterText">本日 <span id="counter">0</span> 回押しました</p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Random Message App</p>
        </footer>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast">コピーしました！</div>

    <script src="script.js"></script>
</body>
</html>
